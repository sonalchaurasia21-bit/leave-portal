<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Leave Balance — CRCE Leave Portal</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
  <script src="selenium-fix.js"></script>
</head>
<body data-page="balance">
  <div class="layout">
    <nav id="sidebar"></nav>
    <div class="main-area">
      <header id="topbar"></header>
      <div class="content">
        <!-- Balance Cards -->
        <div class="balance-grid" id="balance-grid"></div>
        <!-- Usage Timeline -->
        <div class="table-wrapper fade-in">
          <div class="table-wrapper__header">
            <span class="table-wrapper__title"><i class="fa-solid fa-chart-bar"></i> Usage Timeline</span>
          </div>
          <div class="table-scroll">
            <table>
              <thead>
                <tr>
                  <th>Month</th><th>Medical</th><th>Hackathon</th><th>College Event</th><th>Personal</th><th>Total</th>
                </tr>
              </thead>
              <tbody id="timeline-table"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="toast" id="toast"><i class="toast__icon"></i><span class="toast__msg"></span></div>
  <script src="script.js"></script>
  <script src="chatbot.js"></script>
</body>
</html>
