<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <meta name="description" content="CRCE Leave Portal — Login or Register">
  <title>CRCE Leave Portal — Login</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
</head>
<body data-page="login">
  <div class="login-page">
    <div class="login-card">
      <div class="login-card__brand">
        <img src="crce-logo.png" alt="CRCE Logo" class="login-logo-img">
        <h1>Student Portal</h1>
        <p>CRCE Leave Management System</p>
      </div>

      <div class="login-tabs">
        <button class="login-tab active" data-tab="login">Login</button>
        <button class="login-tab" data-tab="register">Register</button>
      </div>

      <!-- Login Form -->
      <div class="login-form-section active" id="section-login">
        <form id="login-form" novalidate>
          <div class="form-group">
            <label for="login-email">Email</label>
            <input type="email" id="login-email" placeholder="you@example.com" required>
            <div class="form-group__error">Please enter your email</div>
          </div>
          <div class="form-group">
            <label for="login-password">Password</label>
            <input type="password" id="login-password" placeholder="Enter password" required>
            <div class="form-group__error">Please enter your password</div>
          </div>
          <button type="submit" class="btn btn-primary btn-full" id="login-btn">
            <i class="fa-solid fa-right-to-bracket"></i> Login
          </button>
        </form>
      </div>

      <!-- Register Form -->
      <div class="login-form-section" id="section-register">
        <form id="register-form" novalidate>
          <div class="form-group">
            <label for="reg-name">Full Name</label>
            <input type="text" id="reg-name" placeholder="John Doe" required>
            <div class="form-group__error">Please enter your name</div>
          </div>
          <div class="form-group">
            <label for="reg-email">Email</label>
            <input type="email" id="reg-email" placeholder="you@example.com" required>
            <div class="form-group__error">Please enter a valid email</div>
          </div>
          <div class="register-fields">
            <div class="form-group">
              <label for="reg-course">Course</label>
              <input type="text" id="reg-course" placeholder="e.g. B.Tech CS" required>
              <div class="form-group__error">Required</div>
            </div>
            <div class="form-group">
              <label for="reg-year">Year</label>
              <select id="reg-year" required>
                <option value="">Select</option>
                <option>FE</option>
                <option>SE</option>
                <option>TE</option>
                <option>BE</option>
              </select>
              <div class="form-group__error">Required</div>
            </div>
          </div>
          <div class="form-group">
            <label for="reg-password">Password</label>
            <input type="password" id="reg-password" placeholder="Create a password" required>
            <div class="form-group__error">Please create a password</div>
          </div>
          <button type="submit" class="btn btn-primary btn-full" id="register-btn">
            <i class="fa-solid fa-user-plus"></i> Register
          </button>
        </form>
      </div>

      <div class="faculty-login-footer">
        <a href="/faculty-login.html" class="faculty-switch-link"><i class="fa-solid fa-chalkboard-user"></i> Faculty Login</a>
        <span style="color:var(--border);margin:0 .5rem">|</span>
        <a href="/hod-login.html" class="faculty-switch-link"><i class="fa-solid fa-user-tie"></i> HOD Login</a>
      </div>
    </div>
  </div>
  <div class="toast" id="toast"><i class="toast__icon"></i><span class="toast__msg"></span></div>
  <script src="script.js"></script>
  <script src="chatbot.js"></script>
</body>
</html>
