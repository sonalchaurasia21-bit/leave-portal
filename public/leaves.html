<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>My Leaves — CRCE Leave Portal</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
</head>
<body data-page="leaves">
  <div class="layout">
    <nav id="sidebar"></nav>
    <div class="main-area">
      <header id="topbar"></header>
      <div class="content">
        <div class="table-wrapper fade-in">
          <div class="table-wrapper__header">
            <span class="table-wrapper__title"><i class="fa-solid fa-list-check"></i> My Leave Applications</span>
            <div class="filter-tabs" id="filter-tabs">
              <button class="filter-tab active" data-filter="All">All</button>
              <button class="filter-tab" data-filter="Pending">Pending</button>
              <button class="filter-tab" data-filter="Approved">Approved</button>
              <button class="filter-tab" data-filter="Rejected">Rejected</button>
            </div>
          </div>
          <div class="table-scroll">
            <table>
              <thead>
                <tr>
                  <th>Leave Type</th><th>From</th><th>To</th><th>Days</th><th>Reason</th><th>Status</th><th>Actions</th>
                </tr>
              </thead>
              <tbody id="leaves-table"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
  <!-- Modal -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal">
      <div class="modal__header">
        <span class="modal__title">Leave Details</span>
        <button class="modal__close" id="modal-close"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div id="modal-body"></div>
    </div>
  </div>
  <div class="toast" id="toast"><i class="toast__icon"></i><span class="toast__msg"></span></div>
  <script src="script.js"></script>
  <script src="chatbot.js"></script>
</body>
</html>
